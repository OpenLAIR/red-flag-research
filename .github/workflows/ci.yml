name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate the benchmark release
        working-directory: benchmark
        run: python -B tools/validate_release.py

      - name: Score the saved baselines
        working-directory: benchmark
        run: |
          python -B tools/evaluate.py --pred baselines/jev_paper_final.jsonl --out "$RUNNER_TEMP/jev.json"
          python -B tools/evaluate.py --pred baselines/qwen_paper_final.jsonl --out "$RUNNER_TEMP/qwen.json"
          python -B tools/evaluate.py --pred baselines/qwen_b_pair_aggregate.jsonl --out "$RUNNER_TEMP/qwen_b.json"


  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out commit history only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/check_dco.sh
          sparse-checkout-cone-mode: false

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check_dco.sh "$BASE_SHA" "$HEAD_SHA"
